name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0              # history for --changed (merge base with the PR's target)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install setuptools online-judge-tools -r library-checker-problems/requirements.txt

      # Test data caches. Keys change only when the tested problems / URLs change or the submodule moves;
      # all.py's in/.version stamps make generate.py redo only the problems that actually changed.
      # Restored from main's caches (PRs can read them); saved only on main (a PR's 6 GB copy would evict main's).
      - name: Plan
        id: plan
        run: python3 testing/ci.py plan ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}

      - name: Restore Library Checker data
        id: lc
        if: steps.plan.outputs.need_lc == 'true'      # PRs touching no Library Checker test skip the ~6 GB
        uses: actions/cache/restore@v4
        with:
          path: |
            library-checker-problems/**/in
            library-checker-problems/**/out
          key: ${{ steps.plan.outputs.lc_key }}
          restore-keys: lc-

      - name: Restore online-judge data
        id: oj
        uses: actions/cache/restore@v4
        with:
          path: testing/.oj-tests
          key: ${{ steps.plan.outputs.oj_key }}
          restore-keys: oj-

      - name: Run tests
        env:
          CXX: g++-14
          COEF: ${{ vars.COEF || '2' }}   # time-limit multiplier (runners are slower than a laptop); override in repo Settings > Variables
          YUKICODER_TOKEN: ${{ secrets.YUKICODER_TOKEN }}
          # PRs: only the tests the PR can affect (testing/all.py --changed); main and manual runs: everything
          ARGS: ${{ github.event_name == 'pull_request' && format('--changed origin/{0}', github.base_ref) || '' }}
        run: make test ARGS="$ARGS"

      - name: Drop data of removed problems
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 testing/ci.py prune

      - name: Save Library Checker data
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.lc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            library-checker-problems/**/in
            library-checker-problems/**/out
          key: ${{ steps.plan.outputs.lc_key }}

      - name: Save online-judge data
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.oj.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: testing/.oj-tests
          key: ${{ steps.plan.outputs.oj_key }}

  pdf:
    needs: verify                     # only build the PDF from code that passes
    runs-on: ubuntu-24.04
    # TeX Live 2026 preinstalled (no apt install each run); the same TeX Live as local builds, so the same pages
    container: texlive/texlive:latest-medium
    steps:
      - uses: actions/checkout@v4

      # packages the medium scheme lacks; "path add" links the new latexminted into PATH (minted v3)
      - run: tlmgr install titlesec minted vntex && tlmgr path add

      # minted v3 runs a custom lexer only if its hash is listed
      - name: Allow the custom lexer
        run: |
          hash=$(sha256sum tex/customlexers/lexers.py | cut -d' ' -f1)
          echo "{\"custom_lexers\": {\"lexers.py\": \"$hash\"}}" > ~/.latexminted_config

      - run: make pdf

      - uses: actions/upload-artifact@v4   # every run (PR previews), kept 90 days
        with:
          name: notebook
          path: tex/main.pdf

  # main: a rolling "latest" release with a stable link (on the runner: the TeX Live image has no git / gh):
  # https://github.com/<owner>/<repo>/releases/download/latest/hesllnotebook.pdf
  release:
    needs: pdf
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write                 # to move the tag and update the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: notebook

      - name: Publish the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv main.pdf hesllnotebook.pdf
          git tag -f latest && git push -f origin latest
          notes="Notebook built from ${GITHUB_SHA::7} (run $GITHUB_RUN_NUMBER)."
          if gh release view latest > /dev/null 2>&1; then
            gh release edit latest --notes "$notes"
          else
            gh release create latest --title "Latest notebook" --notes "$notes"
          fi
          gh release upload latest hesllnotebook.pdf --clobber
