name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install setuptools online-judge-tools -r library-checker-problems/requirements.txt

      # test data: oj/yukicoder downloads and Library Checker generated cases (both skip what is already there).
      # restore-keys: after an all.py edit start from the previous cache and fetch only the new tests.
      - uses: actions/cache/restore@v4
        id: testdata
        with:
          path: |
            testing/.oj-tests
            library-checker-problems/**/in
            library-checker-problems/**/out
          key: tests-${{ hashFiles('testing/all.py') }}
          restore-keys: tests-

      - name: Run tests
        env:
          CXX: g++-14
          COEF: ${{ vars.COEF || '2' }}   # time-limit multiplier (runners are slower than a laptop); override in repo Settings > Variables
          YUKICODER_TOKEN: ${{ secrets.YUKICODER_TOKEN }}
        run: make test

      # save even when tests fail; only when all.py changed (the cache is ~6 GB)
      - uses: actions/cache/save@v4
        if: always() && steps.testdata.outputs.cache-hit != 'true'
        with:
          path: |
            testing/.oj-tests
            library-checker-problems/**/in
            library-checker-problems/**/out
          key: tests-${{ hashFiles('testing/all.py') }}

  pdf:
    needs: verify                     # only build the PDF from code that passes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-extra texlive-lang-other python3-pygments

      # minted v3 runs a custom lexer only if its hash is listed; harmless under minted v2
      - name: Allow the custom lexer
        run: |
          hash=$(sha256sum tex/customlexers/lexers.py | cut -d' ' -f1)
          echo "{\"custom_lexers\": {\"lexers.py\": \"$hash\"}}" > ~/.latexminted_config

      - run: make pdf

      - uses: actions/upload-artifact@v4
        with:
          name: notebook
          path: tex/main.pdf
